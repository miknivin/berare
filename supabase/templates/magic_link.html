<!DOCTYPE html>
<html>
  <body style="font-family: Arial, Helvetica, sans-serif; background: #fbf7f3; margin: 0; padding: 32px;">
    <table role="presentation" width="100%" style="max-width: 480px; margin: 0 auto;">
      <tr>
        <td style="padding-bottom: 24px;">
          <span style="font-size: 20px; font-weight: bold; color: #8c3b4e;">Berare</span>
        </td>
      </tr>
      <tr>
        <td style="background: #ffffff; border: 1px solid #e7d9d3; border-radius: 12px; padding: 32px; text-align: center;">
          <p style="margin: 0 0 16px; color: #2a211f; font-size: 15px;">
            Your login code is:
          </p>
          <p style="margin: 0 0 16px; font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #8c3b4e;">
            {{ .Token }}
          </p>
          <p style="margin: 0; color: #7a6a66; font-size: 13px;">
            This code expires in 10 minutes. If you didn't request this, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
